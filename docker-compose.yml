services:
  postgres:
    image: postgres:16-alpine
    container_name: dev_community_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcommunity}
      POSTGRES_DB: ${POSTGRES_DB:-devcommunity}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
